<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡背设计稿 V2</title>
<style>
:root{ --gold:#d4a853; --gold2:#e8c87a; }
body{
  margin:0; min-height:100vh; background:#0a0a0f; padding:40px 20px;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:#f4f4f5;
  display:flex; flex-direction:column; align-items:center; gap:28px;
}
h2{ color:var(--gold); font-weight:600; margin:0; }
.row{ display:flex; gap:24px; flex-wrap:wrap; justify-content:center; }
.variant{ display:flex; flex-direction:column; align-items:center; gap:12px; }
.variant .name{ color:#8a8a92; font-size:0.9rem; }
.card-back{
  width:280px; height:380px; border-radius:18px; position:relative;
  overflow:hidden; background:#0e0e15;
}
.card-back svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
</style>
</head>
<body>
<h2>卡背设计稿 V2 · 抽象线条系</h2>
<div class="row">

  <!-- D · 金线流川 -->
  <div class="variant">
    <div class="card-back">
      <svg viewBox="0 0 280 380" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="flow1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#d4a853" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#e8c87a" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#d4a853" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="flow2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#d4a853" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#d4a853" stop-opacity="0.28"/>
            <stop offset="1" stop-color="#d4a853" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="glowD" cx="0.5" cy="0.46" r="0.5">
            <stop offset="0" stop-color="#d4a853" stop-opacity="0.10"/>
            <stop offset="1" stop-color="#d4a853" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="280" height="380" fill="#0e0e15"/>
        <rect width="280" height="380" fill="url(#glowD)"/>
        <g fill="none" stroke-linecap="round">
          <path d="M-30 250 C 60 180, 150 300, 310 210" stroke="url(#flow1)" stroke-width="1.6"/>
          <path d="M-30 270 C 70 205, 160 320, 310 235" stroke="url(#flow2)" stroke-width="1.2"/>
          <path d="M-30 290 C 80 230, 170 335, 310 260" stroke="url(#flow2)" stroke-width="1"/>
          <path d="M-30 230 C 50 160, 140 280, 310 185" stroke="url(#flow2)" stroke-width="1"/>
          <path d="M-30 110 C 70 160, 180 60, 310 130" stroke="url(#flow2)" stroke-width="1"/>
          <path d="M-30 90 C 60 135, 190 40, 310 105" stroke="url(#flow2)" stroke-width="0.8" opacity="0.7"/>
        </g>
        <rect x="14" y="14" width="252" height="352" rx="12" fill="none" stroke="#d4a853" stroke-opacity="0.3"/>
        <rect x="20" y="20" width="240" height="340" rx="9" fill="none" stroke="#d4a853" stroke-opacity="0.14"/>
      </svg>
    </div>
    <div class="name">D · 金线流川</div>
  </div>

  <!-- E · 罗盘星芒 -->
  <div class="variant">
    <div class="card-back">
      <svg viewBox="0 0 280 380" preserveAspectRatio="xMidYMid slice">
        <defs>
          <radialGradient id="glowE" cx="0.5" cy="0.5" r="0.55">
            <stop offset="0" stop-color="#d4a853" stop-opacity="0.14"/>
            <stop offset="1" stop-color="#d4a853" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="starG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e8c87a"/>
            <stop offset="1" stop-color="#b8942e"/>
          </linearGradient>
        </defs>
        <rect width="280" height="380" fill="#0e0e15"/>
        <rect width="280" height="380" fill="url(#glowE)"/>
        <g transform="translate(140 190)" fill="none" stroke="#d4a853">
          <circle r="86" stroke-opacity="0.22"/>
          <circle r="70" stroke-opacity="0.35"/>
          <circle r="52" stroke-opacity="0.5"/>
          <g stroke-opacity="0.55">
            <rect x="-42" y="-42" width="84" height="84" transform="rotate(0)"/>
            <rect x="-42" y="-42" width="84" height="84" transform="rotate(45)"/>
          </g>
          <rect x="-28" y="-28" width="56" height="56" transform="rotate(45)" stroke="url(#starG)" stroke-opacity="0.9" stroke-width="1.5"/>
          <circle r="10" stroke="url(#starG)" stroke-width="1.5"/>
          <circle r="3.5" fill="#e8c87a" stroke="none"/>
          <g stroke-opacity="0.3">
            <line x1="0" y1="-100" x2="0" y2="-86"/>
            <line x1="0" y1="100" x2="0" y2="86"/>
            <line x1="-100" y1="0" x2="-86" y2="0"/>
            <line x1="100" y1="0" x2="86" y2="0"/>
          </g>
        </g>
        <rect x="14" y="14" width="252" height="352" rx="12" fill="none" stroke="#d4a853" stroke-opacity="0.3"/>
      </svg>
    </div>
    <div class="name">E · 罗盘星芒</div>
  </div>

  <!-- F · 浮雕回纹 -->
  <div class="variant">
    <div class="card-back">
      <svg viewBox="0 0 280 380" preserveAspectRatio="xMidYMid slice">
        <defs>
          <radialGradient id="glowF" cx="0.5" cy="0.5" r="0.6">
            <stop offset="0" stop-color="#d4a853" stop-opacity="0.07"/>
            <stop offset="1" stop-color="#d4a853" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="280" height="380" fill="#0e0e15"/>
        <rect width="280" height="380" fill="url(#glowF)"/>
        <g transform="translate(140 190)" fill="none" stroke="#d4a853" stroke-opacity="0.16">
          <circle r="18"/>
          <circle r="26"/><circle r="34"/><circle r="42"/><circle r="50"/>
          <circle r="58"/><circle r="66"/><circle r="74"/><circle r="82"/>
          <circle r="90"/><circle r="98"/><circle r="106"/><circle r="114"/>
          <circle r="122"/><circle r="130"/><circle r="138"/>
        </g>
        <g transform="translate(140 190)" fill="none" stroke="#d4a853">
          <circle r="18" stroke-opacity="0.55"/>
          <rect x="-13" y="-13" width="26" height="26" transform="rotate(45)" stroke-opacity="0.75" stroke-width="1.2"/>
          <circle r="3" fill="#e8c87a" stroke="none"/>
        </g>
        <rect x="14" y="14" width="252" height="352" rx="12" fill="none" stroke="#d4a853" stroke-opacity="0.3"/>
        <rect x="20" y="20" width="240" height="340" rx="9" fill="none" stroke="#d4a853" stroke-opacity="0.14"/>
      </svg>
    </div>
    <div class="name">F · 浮雕回纹</div>
  </div>

</div>
<p style="color:#8a8a92;font-size:0.85rem;">D流动艺术 / E精密徽章 / F钞票浮雕感。均无文字、无具象符号。</p>
</body>
</html>
