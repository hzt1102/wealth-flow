<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡背 · 线上效果核对</title>
<style>
:root{ --gold:#d4a853; }
body{
  margin:0; min-height:100vh; background:#0a0a0f; padding:36px 16px;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:#f4f4f5;
  display:flex; flex-direction:column; align-items:center; gap:24px;
}
h2{ color:var(--gold); font-weight:600; margin:0; }
.variant{ display:flex; flex-direction:column; align-items:center; gap:8px; }
.variant .name{ color:#8a8a92; font-size:0.85rem; }
.card-back{
  border-radius:18px; position:relative; overflow:hidden; background:#0e0e15;
  border:1px solid rgba(212,168,83,0.5);
}
.card-back svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.desktop{ width:608px; height:280px; }
.mobile{ width:350px; height:150px; }
@media (max-width:680px){ .desktop{ width:96vw; height:calc(96vw*280/608); } }
</style>
</head>
<body>
<h2>卡背线上效果核对（与游戏逐像素一致）</h2>
<div class="variant">
  <div class="card-back desktop" id="d1"></div>
  <div class="name">桌面卡片 608×280（游戏实际尺寸）</div>
</div>
<div class="variant">
  <div class="card-back mobile" id="d2"></div>
  <div class="name">手机卡片 350×150（最小断点）</div>
</div>
<script>
function cardBackSVG(uid) {
  return '<svg viewBox="0 0 600 280" preserveAspectRatio="xMidYMid slice">'
    + '<defs>'
    + '<radialGradient id="gE' + uid + '" cx="0.5" cy="0.5" r="0.6">'
    + '<stop offset="0" stop-color="#d4a853" stop-opacity="0.13"/><stop offset="1" stop-color="#d4a853" stop-opacity="0"/>'
    + '</radialGradient>'
    + '<linearGradient id="sGE' + uid + '" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="#e8c87a"/><stop offset="1" stop-color="#b8942e"/>'
    + '</linearGradient></defs>'
    + '<rect width="600" height="280" fill="#0e0e15"/>'
    + '<rect width="600" height="280" fill="url(#gE' + uid + ')"/>'
    + '<g stroke="#d4a853" stroke-opacity="0.22" stroke-dasharray="2 6">'
    + '<line x1="40" y1="140" x2="185" y2="140"/><line x1="415" y1="140" x2="560" y2="140"/>'
    + '<line x1="40" y1="112" x2="170" y2="112"/><line x1="430" y1="112" x2="560" y2="112"/>'
    + '<line x1="40" y1="168" x2="170" y2="168"/><line x1="430" y1="168" x2="560" y2="168"/>'
    + '</g>'
    + '<g transform="translate(300 140)" fill="none" stroke="#d4a853">'
    + '<circle r="85" stroke-opacity="0.2"/><circle r="68" stroke-opacity="0.32"/><circle r="48" stroke-opacity="0.48"/>'
    + '<g stroke-opacity="0.55"><rect x="-38" y="-38" width="76" height="76"/><rect x="-38" y="-38" width="76" height="76" transform="rotate(45)"/></g>'
    + '<rect x="-24" y="-24" width="48" height="48" transform="rotate(45)" stroke="url(#sGE' + uid + ')" stroke-opacity="0.9" stroke-width="1.5"/>'
    + '<circle r="9" stroke="url(#sGE' + uid + ')" stroke-width="1.5"/>'
    + '<circle r="3.5" fill="#e8c87a" stroke="none"/>'
    + '<g stroke-opacity="0.3"><line x1="0" y1="-97" x2="0" y2="-85"/><line x1="0" y1="97" x2="0" y2="85"/><line x1="-97" y1="0" x2="-85" y2="0"/><line x1="97" y1="0" x2="85" y2="0"/></g>'
    + '</g>'
    + '<rect x="14" y="14" width="572" height="252" rx="12" fill="none" stroke="#d4a853" stroke-opacity="0.3"/>'
    + '</svg>';
}
document.getElementById('d1').innerHTML = cardBackSVG(1);
document.getElementById('d2').innerHTML = cardBackSVG(2);
</script>
</body>
</html>
